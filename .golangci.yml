version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - nolintlint
    - revive
    - unconvert
    - usestdlibvars
  settings:
    errcheck:
      exclude-functions:
        - (*github.com/yand3r3d3v/nexr/internal/errs.Error).WithHint # returns its receiver for chaining
    gosec:
      excludes:
        - G304 # nexr reads files the user names (config, CA bundle, uploads)
        - G204 # password_command runs a command the user configured
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - errcheck
          - gosec
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/yand3r3d3v/nexr
